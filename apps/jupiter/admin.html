<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin · Jupiter</title><meta name="theme-color" content="#121212">
<link rel="icon" href="/apps/jupiter/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/shared/theme.css">
<style>
body{background:#121212;color:#F2F2F2;margin:0;font-family:Poppins,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:56rem;margin:0 auto;padding:1rem}
header{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}header img{width:34px;height:34px;border-radius:9px}header h1{font-size:1.25rem;margin:0;flex:1}
.tabs{display:flex;gap:.5rem;margin:.5rem 0 1rem}.tabs button{flex:1}
.row{display:flex;align-items:center;gap:.7rem;background:#1E1E1E;border:1px solid #2c2c31;border-radius:14px;padding:.75rem .9rem;margin:.5rem 0}
.row .meta{flex:1;min-width:0}.row b,.row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:#a7a7b0}
.pill{font-size:.72rem;padding:.15rem .5rem;border-radius:99px;background:#262629;color:#a7a7b0}.pill.off{background:#4a2020;color:#ffb4b4}.pill.adm{background:#3a2616;color:#FFAD80}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem;margin:.5rem 0 1rem}.stat{background:#1E1E1E;border:1px solid #2c2c31;border-radius:14px;padding:.8rem}.stat b{font-size:1.4rem;display:block}.stat span{color:#a7a7b0;font-size:.8rem}
.msg{text-align:center;color:#a7a7b0;padding:2rem 1rem}.builtby{text-align:center;color:#6f6f78;font-size:.78rem;margin:1.5rem 0}
.btn.small{padding:.45rem .8rem;font-size:.82rem}
</style></head><body><main id="root"><div class="msg">Loading…</div></main>
<script type="module" src="/shared/neterr.js"></script><script type="module" src="/apps/jupiter/admin.js"></script></body></html>
