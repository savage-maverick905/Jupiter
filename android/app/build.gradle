plugins {
    id 'com.android.application'
}

// Your deployed Jupiter server (HTTPS, no trailing slash). The app screens are bundled inside the APK;
// this URL is only used for your account, library and music streaming.
// Set with -PjupiterUrl=... or the JUPITER_URL environment variable.
def jupiterUrl = (project.findProperty('jupiterUrl') ?: System.getenv('JUPITER_URL') ?: '').toString().trim().replaceAll('/+$', '')
if (!jupiterUrl.startsWith('https://')) {
    throw new GradleException('Set your Jupiter server URL (must start with https://): -PjupiterUrl=https://your-site.vercel.app or env JUPITER_URL. Got: "' + jupiterUrl + '"')
}

android {
    namespace 'app.hie.jupiter'
    compileSdk 34

    defaultConfig {
        applicationId 'app.hie.jupiter'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'BASE_URL', '"' + jupiterUrl + '"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A fixed key so every build is signed the same and installs over the previous one.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    sourceSets {
        main { assets.srcDirs += "$buildDir/generated/www" }
    }
}

// Bundle the web UI (apps/jupiter + shared) into the APK so it opens instantly and works without a connection.
tasks.register('syncWeb', Copy) {
    into "$buildDir/generated/www"
    from("$rootDir/../apps/jupiter") {
        into 'apps/jupiter'
        exclude 'server/**', 'manifest.json', 'sw.js', 'README.md'
    }
    from("$rootDir/../shared") { into 'shared' }
}
tasks.named('preBuild') { dependsOn 'syncWeb' }
